[package]
name = "lapiwe"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
description = "A command-line fountain coding tool powered by RaptorQ (RFC 6330) for data redundancy and recovery in UNIX pipelines."
readme = "README.md"
repository = "https://github.com/AzoteGwei/lapiwe"
keywords = ["raptorq", "fountain-codes", "fec", "erasure-coding", "backup"]
categories = ["command-line-utilities"]

[dependencies]
raptorq = "=2.0.1"
blake3 = "1.8"
crc32c = "0.6"
signal-hook = "0.3"
